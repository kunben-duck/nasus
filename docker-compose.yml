services:
  frontend:
    build:
      context: ./kun-frontend
      dockerfile: Dockerfile
    container_name: autotest-frontend
    environment:
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://backend-java:8080}
    ports:
      - '${FRONTEND_PORT:-3000}:80'
    depends_on:
      backend-java:
        condition: service_healthy
    networks:
      - autotest-network
    restart: unless-stopped

  backend-java:
    build:
      context: ./kun-backend
    container_name: autotest-backend-java
    user: "0:0"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-autotest}
      POSTGRES_USER: ${POSTGRES_USER:-autotest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      EXECUTION_QUEUE_REDIS_KEY: ${EXECUTION_QUEUE_REDIS_KEY:-platform:execution:queue}
      EXECUTION_QUEUE_CONSUMER_ENABLED: ${EXECUTION_QUEUE_CONSUMER_ENABLED:-true}
      EXECUTION_QUEUE_POLL_INTERVAL_MS: ${EXECUTION_QUEUE_POLL_INTERVAL_MS:-300}
      EXECUTION_QUEUE_ERROR_BACKOFF_MS: ${EXECUTION_QUEUE_ERROR_BACKOFF_MS:-1000}
      JWT_SECRET: ${JWT_SECRET:-AutoTestPlatformSecretKey2024SecureJwtTokenForEnterprise}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-local-placeholder}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_TEMPERATURE: ${OPENAI_TEMPERATURE:-0.7}
      PLATFORM_EXECUTION_LOCALHOST_REWRITE_BASE_URL: ${PLATFORM_EXECUTION_LOCALHOST_REWRITE_BASE_URL:-http://frontend}
    ports:
      - '${BACKEND_PORT:-8080}:8080'
    volumes:
      - backend-uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/actuator/health"]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 90s
    networks:
      - autotest-network
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: autotest-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-autotest}
      POSTGRES_USER: ${POSTGRES_USER:-autotest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - '${POSTGRES_HOST_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-autotest} -d ${POSTGRES_DB:-autotest}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - autotest-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: autotest-redis
    command: redis-server --appendonly yes
    ports:
      - '${REDIS_HOST_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - autotest-network
    restart: unless-stopped

volumes:
  backend-uploads:
  postgres-data:
  redis-data:

networks:
  autotest-network:
    driver: bridge
