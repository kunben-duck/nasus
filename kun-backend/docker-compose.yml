version: '3.8'

services:
  # Spring Boot Application
  autotest-platform:
    build: .
    container_name: autotest-platform
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=autotest
      - DB_USER=postgres
      - DB_PASSWORD=password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - EXECUTION_QUEUE_REDIS_KEY=platform:execution:queue
      - EXECUTION_QUEUE_CONSUMER_ENABLED=true
      - EXECUTION_QUEUE_POLL_INTERVAL_MS=300
      - EXECUTION_QUEUE_ERROR_BACKOFF_MS=1000
      - JWT_SECRET=AutoTestPlatformSecretKey2024SecureJwtTokenForEnterprise
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - autotest-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: autotest-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=autotest
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - autotest-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d autotest"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: autotest-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - autotest-network
    restart: unless-stopped
    command: redis-server --appendonly yes

volumes:
  postgres-data:
  redis-data:

networks:
  autotest-network:
    driver: bridge
