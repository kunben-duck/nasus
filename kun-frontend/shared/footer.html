<footer class="footer">
  <div class="flex flex-col items-center gap-2">
    <p class="footer-text">

    </p>
    <p class="text-xs text-gray-600">
      智能自动化测试平台 | Intelligent Test Automation Platform
    </p>
    <div class="flex items-center gap-4 mt-2">
      <a href="#" class="text-xs text-gray-500 hover:text-cyan-400 transition-colors" onclick="showToast('info', '隐私政策页面即将上线'); return false;">
        隐私政策

<script>

  (function() {
    const yearElement = document.getElementById('current-year');
    if (yearElement) {
      yearElement.textContent = new Date().getFullYear();
    }
  })();
</script>
