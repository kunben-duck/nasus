  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background-color: #0a0a0f;
      color: #ffffff;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }
    #particle-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }
    .glass-card {
      background: rgba(18, 18, 26, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px);
      border-radius: 12px;
    }
    .gradient-text {
      background: linear-gradient(135deg, #00d4ff 0%, #7c3aed 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .nav-item-active {
      background: rgba(0, 212, 255, 0.1);
      border-left: 3px solid #00d4ff;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in-up {
      animation: fadeInUp 0.5s ease forwards;
      opacity: 0;
    }
    .stagger-1 { animation-delay: 0.1s; }
    .stagger-2 { animation-delay: 0.2s; }
    .stagger-3 { animation-delay: 0.3s; }
    .status-pending { background: rgba(113, 113, 122, 0.2); color: #a1a1aa; }
    .status-parsing { background: rgba(59, 130, 246, 0.2); color: #3b82f6; }
    .status-done { background: rgba(16, 185, 129, 0.2); color: #10b981; }
    .status-error { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
    .modal-overlay {
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(4px);
    }
  </style>
</head>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      initParticleBackground();
    });
    
    function openParseModal() {
      document.getElementById('parse-modal').classList.remove('hidden');
    }
    
    function closeParseModal() {
      document.getElementById('parse-modal').classList.add('hidden');
    }
    
    function openImportModal() {
      document.getElementById('import-modal').classList.remove('hidden');
    }
    
    function closeImportModal() {
      document.getElementById('import-modal').classList.add('hidden');
    }
    
    function startParsing() {
      closeParseModal();
      // Show toast notification
      showToast('AI 解析已开始，请稍候...', 'info');
    }
    
    function showToast(message, type) {
      const toast = document.createElement('div');
      toast.className = `fixed bottom-4 right-4 px-4 py-3 rounded-lg glass-card z-50 flex items-center gap-2 ${type === 'error' ? 'text-[#ef4444]' : type === 'success' ? 'text-[#10b981]' : 'text-[#00d4ff]'}`;
      toast.innerHTML = `<i data-lucide="${type === 'error' ? 'alert-circle' : type === 'success' ? 'check-circle' : 'info'}" class="w-4 h-4"></i><span class="text-sm">${message}</span>`;
      document.body.appendChild(toast);
      lucide.createIcons();
      setTimeout(() => toast.remove(), 3000);
    }
    
    function initParticleBackground() {
      const canvas = document.getElementById('particle-canvas');
      if (!canvas) return;
      
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      let renderer;
      try {
        renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
      } catch (error) {
        console.warn('Particle background disabled:', error.message);
        return;
      }
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      
      const particleCount = 80;
      const positions = new Float32Array(particleCount * 3);
      const velocities = [];
      const color1 = new THREE.Color('#00d4ff');
      const color2 = new THREE.Color('#7c3aed');
      const colors = new Float32Array(particleCount * 3);
      
      for (let i = 0; i < particleCount; i++) {
        positions[i * 3] = (Math.random() - 0.5) * 20;
        positions[i * 3 + 1] = (Math.random() - 0.5) * 20;
        positions[i * 3 + 2] = (Math.random() - 0.5) * 10;
        
        velocities.push({
          x: (Math.random() - 0.5) * 0.01,
          y: (Math.random() - 0.5) * 0.01,
          z: (Math.random() - 0.5) * 0.005
        });
        
        const mixFactor = Math.random();
        const color = color1.clone().lerp(color2, mixFactor);
        colors[i * 3] = color.r;
        colors[i * 3 + 1] = color.g;
        colors[i * 3 + 2] = color.b;
      }
      
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      
      const material = new THREE.PointsMaterial({
        size: 0.08,
        vertexColors: true,
        transparent: true,
        opacity: 0.8,
        blending: THREE.AdditiveBlending
      });
      
      const particles = new THREE.Points(geometry, material);
      scene.add(particles);
      
      camera.position.z = 8;
      
      let mouseX = 0, mouseY = 0;
      const handleMouseMove = (e) => {
        mouseX = (e.clientX / window.innerWidth) * 2 - 1;
        mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
      };
      window.addEventListener('mousemove', handleMouseMove, { passive: true });
      
      let animationId;
      const animate = () => {
        animationId = requestAnimationFrame(animate);
        const posArray = geometry.attributes.position.array;
        
        for (let i = 0; i < particleCount; i++) {
          posArray[i * 3] += velocities[i].x;
          posArray[i * 3 + 1] += velocities[i].y;
          posArray[i * 3 + 2] += velocities[i].z;
          
          const dx = mouseX * 5 - posArray[i * 3];
          const dy = mouseY * 5 - posArray[i * 3 + 1];
          const dist = Math.sqrt(dx * dx + dy * dy);
          
          if (dist < 3) {
            posArray[i * 3] -= dx * 0.01;
            posArray[i * 3 + 1] -= dy * 0.01;
          }
          
          if (Math.abs(posArray[i * 3]) > 10) velocities[i].x *= -1;
          if (Math.abs(posArray[i * 3 + 1]) > 10) velocities[i].y *= -1;
          if (Math.abs(posArray[i * 3 + 2]) > 5) velocities[i].z *= -1;
        }
        
        geometry.attributes.position.needsUpdate = true;
        particles.rotation.y += 0.0005;
        renderer.render(scene, camera);
      };
      animate();
      
      const handleResize = () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      };
      window.addEventListener('resize', handleResize, { passive: true });
    }
  </script>
