services:
  - type: web
    name: nasus-backend-api
    runtime: docker
    repo: https://github.com/kunben-duck/nasus
    plan: free
    branch: codex/render-deploy
    autoDeploy: true
    dockerContext: ./kun-backend
    dockerfilePath: ./kun-backend/Dockerfile
    healthCheckPath: /api/actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: POSTGRES_HOST
        fromDatabase:
          name: nasus-postgres
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: nasus-postgres
          property: port
      - key: POSTGRES_DB
        fromDatabase:
          name: nasus-postgres
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: nasus-postgres
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: nasus-postgres
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_TEMPERATURE
        value: "0.7"
      - key: PLATFORM_EXECUTION_LOCALHOST_REWRITE_BASE_URL
        value: https://nasus-frontend-web.onrender.com

  - type: web
    name: nasus-frontend-web
    runtime: docker
    repo: https://github.com/kunben-duck/nasus
    plan: free
    branch: codex/render-deploy
    autoDeploy: true
    dockerContext: ./kun-frontend
    dockerfilePath: ./kun-frontend/Dockerfile
    envVars:
      - key: API_PROXY_TARGET
        value: https://nasus-backend-api.onrender.com

databases:
  - name: nasus-postgres
    databaseName: autotest
    user: autotest
    plan: free
    postgresMajorVersion: "16"
    ipAllowList: []
