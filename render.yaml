services:
  - type: keyvalue
    name: autotest-redis
    plan: free
    ipAllowList: []

  - type: web
    name: autotest-backend
    runtime: docker
    plan: free
    dockerContext: ./kun-backend
    dockerfilePath: ./kun-backend/Dockerfile
    autoDeploy: true
    healthCheckPath: /api/actuator/health
    envVars:
      - key: PORT
        value: "10000"
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: DB_HOST
        fromDatabase:
          name: autotest-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: autotest-postgres
          property: port
      - key: DB_NAME
        fromDatabase:
          name: autotest-postgres
          property: database
      - key: DB_USER
        fromDatabase:
          name: autotest-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: autotest-postgres
          property: password
      - key: REDIS_HOST
        fromService:
          type: keyvalue
          name: autotest-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: keyvalue
          name: autotest-redis
          property: port
      - key: EXECUTION_QUEUE_REDIS_KEY
        value: platform:execution:queue
      - key: EXECUTION_QUEUE_CONSUMER_ENABLED
        value: "true"
      - key: EXECUTION_QUEUE_POLL_INTERVAL_MS
        value: "300"
      - key: PLATFORM_EXECUTION_LOCALHOST_REWRITE_BASE_URL
        value: http://autotest-frontend:10000
      - key: JWT_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_TEMPERATURE
        value: "0.7"

  - type: web
    name: autotest-frontend
    runtime: docker
    plan: free
    dockerContext: ./kun-frontend
    dockerfilePath: ./kun-frontend/Dockerfile
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "10000"
      - key: API_PROXY_TARGET
        value: http://autotest-backend:10000

databases:
  - name: autotest-postgres
    databaseName: autotest
    user: autotest
    plan: free
